<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@100..900&family=Poppins:wght@100..900&family=Shadows+Into+Light&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css"
      rel="stylesheet"
    />
    <title>SLB Rumah Melati</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
      :root {
        --ink: #241a2e;
        --muted: #6f6478;
        --leaf: #146b4f;
        --leaf-deep: #0d4c38;
        --mint: #e9f4ee;
        --focus: #e7a614;
        --card: rgba(245, 241, 248, 0.72);
        --u: 1vh;
        --u: 1dvh;
      }
      * {
        box-sizing: border-box;
      }
      body {
        background: #101a1c;
        font-family: "Poppins", sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        min-height: 100dvh;
        margin: 0;
      }
      /* Bingkai tampilan mengikuti rasio image.png (736 x 1308) */
      .page {
        position: relative;
        width: min(100vw, calc(100vh * 0.5627));
        width: min(100vw, calc(100dvh * 0.5627));
        height: min(100vh, calc(100vw * 1.7772));
        height: min(100dvh, calc(100vw * 1.7772));
        padding: clamp(8px, calc(var(--u) * 1.8), 24px) 0;
        background-image: url(image.png);
        background-size: cover;
        background-repeat: no-repeat;
        background-position: center;
        display: flex;
        overflow-x: hidden;
        overflow-y: auto;
      }
      .container {
        margin: auto;
        background: var(--card);
        border: 1px solid rgba(255, 255, 255, 0.4);
        border-radius: 24px;
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        box-shadow: 0 18px 40px rgba(16, 42, 34, 0.18);
        text-align: center;
        padding: clamp(12px, calc(var(--u) * 2.2), 28px)
          clamp(14px, 4vw, 24px);
        width: 90%;
        max-width: 400px;
      }
      .profile img {
        width: clamp(84px, calc(var(--u) * 11.5), 150px);
        height: clamp(84px, calc(var(--u) * 11.5), 150px);
        object-fit: cover;
      }
      h1 {
        font-family: "Shadows Into Light", sans-serif;
        font-size: clamp(24px, calc(var(--u) * 3.2), 38px);
        margin: clamp(4px, calc(var(--u) * 0.8), 10px) 0;
        color: var(--leaf);
      }
      p {
        color: var(--muted);
        font-size: clamp(12.5px, calc(var(--u) * 1.8), 18px);
        line-height: 1.4;
      }
      .social-icons {
        display: flex;
        justify-content: center;
        gap: clamp(10px, calc(var(--u) * 1.4), 14px);
        margin-bottom: clamp(8px, calc(var(--u) * 1.6), 18px);
      }
      .social-icons a {
        text-decoration: none;
        font-size: clamp(16px, calc(var(--u) * 2.2), 22px);
        color: var(--leaf);
        transition: all 0.25s ease;
      }
      .social-icons a:hover {
        color: var(--focus);
        transform: translateY(-2px);
      }
      .links a {
        display: block;
        text-decoration: none;
        background: var(--mint);
        color: var(--leaf-deep);
        padding: clamp(6px, calc(var(--u) * 1.2), 12px)
          clamp(12px, 4vw, 18px);
        margin: clamp(3.5px, calc(var(--u) * 0.8), 10px)
          clamp(4px, 1.2vw, 8px);
        border-radius: 999px;
        font-size: clamp(12.5px, calc(var(--u) * 1.55), 16px);
        line-height: 1.35;
        font-weight: 600;
        transition: all 0.25s ease;
      }
      .links a:hover {
        background: var(--leaf);
        color: #fff;
        transform: translateY(-1px);
      }
      .links a.primary {
        background: var(--leaf);
        color: #fff;
      }
      .links a.primary:hover {
        background: var(--leaf-deep);
      }
      .copyright {
        margin: clamp(10px, calc(var(--u) * 1.8), 28px) 0 4px;
        font-size: clamp(10px, calc(var(--u) * 1.1), 13px);
        color: var(--muted);
      }
      .copyright a {
        font-weight: 700;
        text-decoration: none;
        color: var(--ink);
      }
      a:focus-visible {
        outline: 3px solid var(--focus);
        outline-offset: 2px;
      }

      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(14px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .profile,
      h1,
      .container > p,
      .social-icons,
      .links a,
      .copyright {
        animation: rise 0.5s ease-out both;
      }
      .profile {
        animation-delay: 0.05s;
      }
      h1 {
        animation-delay: 0.1s;
      }
      .container > p {
        animation-delay: 0.16s;
      }
      .social-icons {
        animation-delay: 0.22s;
      }
      .links a:nth-child(1) {
        animation-delay: 0.28s;
      }
      .links a:nth-child(2) {
        animation-delay: 0.33s;
      }
      .links a:nth-child(3) {
        animation-delay: 0.38s;
      }
      .links a:nth-child(4) {
        animation-delay: 0.43s;
      }
      .links a:nth-child(5) {
        animation-delay: 0.48s;
      }
      .links a:nth-child(6) {
        animation-delay: 0.53s;
      }
      .links a:nth-child(7) {
        animation-delay: 0.58s;
      }
      .links a:nth-child(8) {
        animation-delay: 0.63s;
      }
      .links a:nth-child(9) {
        animation-delay: 0.68s;
      }
      .copyright {
        animation-delay: 0.76s;
      }

      @media (prefers-reduced-motion: reduce) {
        .profile,
        h1,
        .container > p,
        .social-icons,
        .links a,
        .copyright {
          animation: none;
        }
      }

      /* Di layar yang lebih ramping dari image.png, tampilan memenuhi layar */
      @media (max-aspect-ratio: 736 / 1308) {
        .page {
          width: 100vw;
          height: 100vh;
          height: 100dvh;
        }
      }
      /* Layar pendek (mis. ponsel landscape) juga dibuat memenuhi layar */
      @media (max-height: 500px) {
        .page {
          width: 100vw;
          height: 100vh;
          height: 100dvh;
        }
      }

      @media (max-width: 480px) {
        .container {
          width: calc(100% - 32px);
        }
      }

      /* Ponsel pendek: rapatkan lagi supaya semua tautan tetap muat */
      @media (max-height: 600px) and (orientation: portrait) {
        .container {
          padding-top: 10px;
          padding-bottom: 10px;
        }
        .profile img {
          width: 72px;
          height: 72px;
        }
        .social-icons {
          margin-bottom: 6px;
        }
        .links a {
          padding-top: 5px;
          padding-bottom: 5px;
          margin-top: 3px;
          margin-bottom: 3px;
        }
        .copyright {
          margin-top: 8px;
        }
      }
    </style>
  </head>
