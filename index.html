<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@100..900&family=Poppins:wght@100..900&family=Shadows+Into+Light&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css"
      rel="stylesheet"
    />
    <title>SLB Rumah Melati</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
      :root {
        --ink: #241a2e;
        --muted: #6f6478;
        --leaf: #146b4f;
        --leaf-deep: #0d4c38;
        --mint: #e9f4ee;
        --focus: #e7a614;
        --card: #f5f1f8;
      }
      * {
        box-sizing: border-box;
      }
      body {
        background-image: url(image.png);
        background-size: cover;
        background-repeat: no-repeat;
        background-position: center;
        font-family: "Poppins", sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100dvh;
        padding: 20px 0;
        margin: 0;
      }
      .container {
        background: var(--card);
        text-align: center;
        padding: 28px 24px;
        border-radius: 50%;
        width: 90%;
        max-width: 400px;
      }
      .profile img {
        width: 150px;
        height: 150px;
        object-fit: cover;
      }
      h1 {
        font-family: "Shadows Into Light", sans-serif;
        font-size: 38px;
        margin: 10px 0;
        color: var(--leaf);
      }
      p {
        color: var(--muted);
        font-size: 18px;
      }
      .social-icons {
        display: flex;
        justify-content: center;
        gap: 14px;
        margin-bottom: 18px;
      }
      .social-icons a {
        text-decoration: none;
        font-size: 22px;
        color: var(--leaf);
        transition: all 0.25s ease;
      }
      .social-icons a:hover {
        color: var(--focus);
        transform: translateY(-2px);
      }
      .links a {
        display: block;
        text-decoration: none;
        background: var(--mint);
        color: var(--leaf-deep);
        padding: 12px 18px;
        margin: 10px 8px;
        border-radius: 50%;
        font-weight: 600;
        transition: all 0.25s ease;
      }
      .links a:hover {
        background: var(--leaf);
        color: #fff;
        transform: translateY(-1px);
      }
      .links a.primary {
        background: var(--leaf);
        color: #fff;
      }
      .links a.primary:hover {
        background: var(--leaf-deep);
      }
      .copyright {
        margin: 28px 0 4px;
        font-size: 13px;
        color: var(--muted);
      }
      .copyright a {
        font-weight: 700;
        text-decoration: none;
        color: var(--ink);
      }
      a:focus-visible {
        outline: 3px solid var(--focus);
        outline-offset: 2px;
      }

      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(14px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .profile,
      h1,
      .container > p,
      .social-icons,
      .links a,
      .copyright {
        animation: rise 0.5s ease-out both;
      }
      .profile {
        animation-delay: 0.05s;
      }
      h1 {
        animation-delay: 0.1s;
      }
      .container > p {
        animation-delay: 0.16s;
      }
      .social-icons {
        animation-delay: 0.22s;
      }
      .links a:nth-child(1) {
        animation-delay: 0.28s;
      }
      .links a:nth-child(2) {
        animation-delay: 0.33s;
      }
      .links a:nth-child(3) {
        animation-delay: 0.38s;
      }
      .links a:nth-child(4) {
        animation-delay: 0.43s;
      }
      .links a:nth-child(5) {
        animation-delay: 0.48s;
      }
      .links a:nth-child(6) {
        animation-delay: 0.53s;
      }
      .links a:nth-child(7) {
        animation-delay: 0.58s;
      }
      .links a:nth-child(8) {
        animation-delay: 0.63s;
      }
      .links a:nth-child(9) {
        animation-delay: 0.68s;
      }
      .copyright {
        animation-delay: 0.76s;
      }

      @media (prefers-reduced-motion: reduce) {
        .profile,
        h1,
        .container > p,
        .social-icons,
        .links a,
        .copyright {
          animation: none;
        }
      }

      @media (max-width: 380px) {
        .container {
          padding: 22px 16px;
          width: calc(100% - 32px);
          margin: 0 auto;
        }
        .profile img {
          width: 120px;
          height: 120px;
        }
        h1 {
          font-size: 30px;
        }
        p {
          color: var(--muted);
          font-size: 16px;
        }
        .social-icons a {
          font-size: 20px;
        }
        .links a {
          font-size: 13px;
          padding: 11px 16px;
          margin: 8px 4px;
        }
        .copyright {
          margin: 22px 0 4px;
          font-size: 13px;
        }
      }
    </style>
  </head>
